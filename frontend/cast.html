<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cast Profile • CineVerse</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Header Bar -->
  <nav id="navbar" class="navbar"></nav>

  <!-- Main Content Wrapper -->
  <main class="main-wrapper">
    <div id="cast-header">
      <div style="text-align:center; padding:3rem; color:var(--text-dim);"><i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--accent-purple);"></i></div>
    </div>

    <div style="margin-top:2rem;">
      <h2 style="font-family:var(--font-heading); color:#fff; font-size:1.4rem; margin-bottom:1.5rem;"><i class="fa-solid fa-film" style="color:var(--accent-cyan);"></i> Filmography</h2>
      <div id="cast-filmography-grid" class="movies-grid"></div>
    </div>
  </main>

  <script src="/static/script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof initCastPage === 'function') {
        initCastPage();
      }
    });
  </script>
</body>
</html>
