<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · FilmHub</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">

      <div class="auth-brand">FilmHub</div>

      <div class="auth-toggle">
        <button class="btn active" id="tab-login" onclick="switchTab('login')">Login</button>
        <button class="btn" id="tab-signup" onclick="switchTab('signup')">Sign up</button>
      </div>

      <!-- Login form -->
      <form id="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </div>
        <p class="error-text" id="login-error"></p>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
        <div class="auth-links">
          <a href="#">Forgot password?</a>
          <a href="#" onclick="switchTab('signup'); return false;">Don't have an account?</a>
        </div>
      </form>

      <!-- Signup form -->
      <form id="signup-form" style="display:none;">
        <div class="field">
          <label for="signup-username">Username</label>
          <input type="text" id="signup-username" placeholder="yourname" required />
        </div>
        <div class="field">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="••••••••" required />
        </div>
        <p class="error-text" id="signup-error"></p>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
        <div class="auth-links">
          <a href="#" onclick="switchTab('login'); return false;">Already have an account?</a>
        </div>
      </form>

    </div>
  </div>

  <script src="/static/script.js"></script>
  <script>
    // Open on the signup tab if the homepage linked here with ?mode=signup
    if (new URLSearchParams(window.location.search).get("mode") === "signup") {
      switchTab("signup");
    }
  </script>
</body>
</html>
